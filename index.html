<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teen Patti - सिक्का संस्करण</title>
    <!-- Google Ad Placement API (विज्ञापन के लिए) -->
    <script async
            data-adbreak-test="on"
            src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX"
            crossorigin="anonymous">
    </script>
    <script>
        window.adsbygoogle = window.adsbygoogle || [];
        const adBreak = adConfig = (o) => { adsbygoogle.push(o); };
    </script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
            overflow: hidden;
        }
        .container {
            text-align: center;
            background: #16213e;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            border: 2px solid #e94560;
            width: 340px;
        }
        .title {
            font-size: 28px;
            color: #e94560;
            margin-bottom: 15px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
        }
        .coin-display {
            font-size: 22px;
            margin: 15px 0;
            background: #0f3460;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #e94560;
        }
        .coin-display span {
            color: #f1c40f;
            font-weight: bold;
        }
        .btn {
            background: #e94560;
            color: white;
            border: none;
            padding: 12px 24px;
            margin: 8px 0;
            border-radius: 50px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            font-weight: bold;
        }
        .btn:hover {
            background: #c0392b;
            transform: scale(1.02);
        }
        .btn:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
        }

        /* =========================================
           🌟 खूबसूरत विज्ञापन बॉक्स का डिज़ाइन 🌟
           ========================================= */
        .ad-container {
            margin: 20px 0;
            position: relative;
            width: 100%;
            padding: 3px;
            border-radius: 15px;
            /* गोल्डन और ब्लू ग्रेडिएंट बॉर्डर */
            background: linear-gradient(45deg, #f1c40f, #e94560, #0f3460, #f1c40f);
            background-size: 300% 300%;
            animation: gradientBorder 3s ease infinite;
            box-shadow: 0 0 15px rgba(233, 69, 96, 0.5);
            display: none; /* शुरुआत में छिपा हुआ, विज्ञापन लोड होने पर दिखेगा */
        }

        @keyframes gradientBorder {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .ad-box-inner {
            background: #0b132b; /* अंदर का डार्क बैकग्राउंड */
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 120px; /* विज्ञापन के लिए जगह */
            position: relative;
            overflow: hidden;
        }

        /* विज्ञापन के अंदर का टेक्स्ट (जब तक असली विज्ञापन न लगे) */
        .ad-placeholder-text {
            color: #7f8c8d;
            font-size: 14px;
            font-weight: normal;
            z-index: 1;
            text-align: center;
        }
        
        .ad-placeholder-text strong {
            color: #f1c40f;
            display: block;
            margin-bottom: 5px;
            font-size: 16px;
        }

        /* असली विज्ञापन (iframe/ins) को फिट करने के लिए */
        .ad-real-content {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
        }

        /* विज्ञापन के ऊपर एक छोटा सा "AD" टैग */
        .ad-badge {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(233, 69, 96, 0.8);
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            z-index: 3;
            letter-spacing: 1px;
        }

        .msg {
            margin-top: 10px;
            font-size: 13px;
            color: #aaa;
            min-height: 20px;
        }

        .btn-ad {
            background: #27ae60;
            margin-top: 10px;
        }
        .btn-ad:hover {
            background: #2ecc71;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="title">Teen Patti</div>
    
    <div class="coin-display">
        आपके सिक्के: <span id="coinDisplay">100</span>
    </div>

    <button class="btn" onclick="playGame()" id="playBtn">
        खेल शुरू करें (100 सिक्के लागत)
    </button>

    <!-- =========================================
         🌟 विज्ञापन बॉक्स यहाँ है 🌟
         ========================================= -->
    <div class="ad-container" id="adBox">
        <div class="ad-badge">AD</div>
        <div class="ad-box-inner">
            <!-- जब तक असली विज्ञापन नहीं लगाते, यह टेक्स्ट दिखेगा -->
            <div class="ad-placeholder-text">
                <strong>यहाँ विज्ञापन आएगा</strong>
                AdSense या अन्य विज्ञापन कोड यहाँ पेस्ट करें
            </div>
            
            <!-- 
                बाद में अपना विज्ञापन यहाँ लगाएं: 
                उदाहरण के लिए Google AdSense का कोड:
                <ins class="adsbygoogle"
                     style="display:block"
                     data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
                     data-ad-slot="1234567890"
                     data-ad-format="auto"
                     data-full-width-responsive="true"></ins>
                <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
            -->
            <div class="ad-real-content" id="realAdSlot">
                <!-- असली विज्ञापन का कोड यहाँ जाएगा -->
            </div>
        </div>
    </div>

    <button class="btn btn-ad" onclick="showRewardedAd()" id="adBtn">
        📺 विज्ञापन देखें +500 सिक्के
    </button>

    <div class="msg" id="message"></div>
</div>

<script>
    let coins = parseInt(localStorage.getItem('teenPattiCoins')) || 100;
    const coinDisplay = document.getElementById('coinDisplay');
    const messageEl = document.getElementById('message');
    const adBtn = document.getElementById('adBtn');
    const adBox = document.getElementById('adBox');

    function updateCoinDisplay() {
        coinDisplay.textContent = coins;
        localStorage.setItem('teenPattiCoins', coins);
    }

    function playGame() {
        if (coins < 100) {
            messageEl.textContent = "सिक्के कम हैं, विज्ञापन देखें!";
            return;
        }
        coins -= 100;
        updateCoinDisplay();
        messageEl.textContent = "खेल शुरू... (डेमो)";
    }

    function showRewardedAd() {
        messageEl.textContent = "विज्ञापन लोड हो रहा है...";
        adBtn.disabled = true;
        
        // विज्ञापन बॉक्स को दिखाएं (एनिमेशन के साथ)
        adBox.style.display = 'block';

        adBreak({
            type: 'reward',
            name: 'coin_reward',
            beforeAd: () => {
                messageEl.textContent = "विज्ञापन चल रहा है...";
            },
            afterAd: () => {
                messageEl.textContent = "विज्ञापन समाप्त, इनाम दे रहे हैं...";
            },
            beforeReward: (showAdFn) => {
                showAdFn();
            },
            adViewed: () => {
                coins += 500;
                updateCoinDisplay();
                messageEl.textContent = "🎉 बधाई हो! 500 सिक्के मिले!";
                adBtn.disabled = false;
                // इनाम मिलने के बाद बॉक्स को छिपा सकते हैं या दिखा सकते हैं
                // adBox.style.display = 'none'; 
            },
            adDismissed: () => {
                messageEl.textContent = "विज्ञापन पूरा नहीं देखा, इनाम नहीं मिला।";
                adBtn.disabled = false;
            },
            adError: (error) => {
                console.error('Ad error:', error);
                messageEl.textContent = "विज्ञापन लोड नहीं हो सका (टेस्ट मोड)।";
                adBtn.disabled = false;
            }
        });
    }

    // पेज लोड होने पर विज्ञापन बॉक्स दिखाएं (या आप इसे किसी बटन से कंट्रोल कर सकते हैं)
    window.onload = () => {
        updateCoinDisplay();
        // अगर आप चाहते हैं कि बॉक्स हमेशा दिखे तो इसे 'block' कर दें
        adBox.style.display = 'block'; 
    };
</script>

</body>
</html>
