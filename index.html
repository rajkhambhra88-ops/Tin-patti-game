<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teen Patti - सिक्का संस्करण</title>
    <!-- Google Ad Placement API (विज्ञापन के लिए) -->
    <script async
            data-adbreak-test="on"
            src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX"
            crossorigin="anonymous">
    </script>
    <script>
        window.adsbygoogle = window.adsbygoogle || [];
        const adBreak = adConfig = (o) => { adsbygoogle.push(o); };
    </script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
            overflow: hidden;
        }
        .container {
            text-align: center;
            background: #16213e;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            border: 2px solid #e94560;
            width: 340px;
        }
        .title {
            font-size: 28px;
            color: #e94560;
            margin-bottom: 15px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
        }
        .coin-display {
            font-size: 22px;
            margin: 15px 0;
            background: #0f3460;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #e94560;
        }
        .coin-display span {
            color: #f1c40f;
            font-weight: bold;
        }
        .btn {
            background: #e94560;
            color: white;
            border: none;
            padding: 12px 24px;
            margin: 8px 0;
            border-radius: 50px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            font-weight: bold;
        }
        .btn:hover {
            background: #c0392b;
            transform: scale(1.02);
        }
        .btn:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
        }

        /* =========================================
           🌟 खूबसूरत विज्ञापन बॉक्स का डिज़ाइन 🌟
           ========================================= */
        .ad-container {
            margin: 15px 0;
            position: relative;
            width: 100%;
            padding: 3px;
            border-radius: 15px;
            background: linear-gradient(45deg, #f1c40f, #e94560, #0f3460, #f1c40f);
            background-size: 300% 300%;
            animation: gradientBorder 3s ease infinite;
            box-shadow: 0 0 15px rgba(233, 69, 96, 0.5);
            display: none; 
        }

        @keyframes gradientBorder {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .ad-box-inner {
            background: #0b132b;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100px;
            position: relative;
            overflow: hidden;
        }

        .ad-placeholder-text {
            color: #7f8c8d;
            font-size: 14px;
            font-weight: normal;
            z-index: 1;
            text-align: center;
        }
        
        .ad-placeholder-text strong {
            color: #f1c40f;
            display: block;
            margin-bottom: 5px;
            font-size: 16px;
        }

        .ad-real-content {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
        }

        .ad-badge {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(233, 69, 96, 0.8);
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            z-index: 3;
            letter-spacing: 1px;
        }

        .msg {
            margin-top: 10px;
            font-size: 13px;
            color: #aaa;
            min-height: 20px;
        }

        .btn-ad {
            background: #27ae60;
            margin-top: 10px;
        }
        .btn-ad:hover {
            background: #2ecc71;
        }

        /* =========================================
           🌟 शेयर बटन का डिज़ाइन 🌟
           ========================================= */
        .btn-share {
            background: #3498db;
            margin-top: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .btn-share:hover {
            background: #2980b9;
        }
        .btn-share svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="title">Teen Patti</div>
    
    <!-- सिक्का प्रदर्शन -->
    <div class="coin-display">
        आपके सिक्के: <span id="coinDisplay">10000</span>
    </div>

    <!-- खेल बटन -->
    <button class="btn" onclick="playGame()" id="playBtn">
        खेल शुरू करें (100 सिक्के लागत)
    </button>

    <!-- =========================================
         🌟 विज्ञापन बॉक्स 🌟
         ========================================= -->
    <div class="ad-container" id="adBox">
        <div class="ad-badge">AD</div>
        <div class="ad-box-inner">
            <div class="ad-placeholder-text">
                <strong>यहाँ विज्ञापन आएगा</strong>
                AdSense या अन्य विज्ञापन कोड यहाँ पेस्ट करें
            </div>
            <!-- असली विज्ञापन का कोड यहाँ जाएगा -->
            <div class="ad-real-content" id="realAdSlot"></div>
        </div>
    </div>

    <!-- विज्ञापन देखकर सिक्के प्राप्त करने का बटन -->
    <button class="btn btn-ad" onclick="showRewardedAd()" id="adBtn">
        📺 विज्ञापन देखें +500 सिक्के
    </button>

    <!-- =========================================
         🌟 शेयर बटन (+5 सिक्के) 🌟
         ========================================= -->
    <button class="btn btn-share" onclick="shareGame()" id="shareBtn">
        <!-- शेयर आइकॉन -->
        <svg viewBox="0 0 24 24">
            <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/>
        </svg>
        गेम शेयर करें (+5 सिक्के)
    </button>

    <div class="msg" id="message"></div>
</div>

<script>
    // 🌟 1. शुरुआती सिक्कों की संख्या 10,000 कर दी गई है 🌟
    // अगर localStorage में पहले से डेटा नहीं है, तो 10000 सेट होगा
    let coins = parseInt(localStorage.getItem('teenPattiCoins'));
    if (isNaN(coins)) {
        coins = 10000; 
    }

    const coinDisplay = document.getElementById('coinDisplay');
    const messageEl = document.getElementById('message');
    const adBtn = document.getElementById('adBtn');
    const adBox = document.getElementById('adBox');
    const shareBtn = document.getElementById('shareBtn');

    function updateCoinDisplay() {
        coinDisplay.textContent = coins;
        localStorage.setItem('teenPattiCoins', coins);
    }

    function playGame() {
        if (coins < 100) {
            messageEl.textContent = "सिक्के कम हैं, विज्ञापन देखें या गेम शेयर करें!";
            return;
        }
        coins -= 100;
        updateCoinDisplay();
        messageEl.textContent = "खेल शुरू... (डेमो)";
    }

    // 🌟 2. शेयर करने पर 5 सिक्के देने का फंक्शन 🌟
    function shareGame() {
        // Web Share API का उपयोग (मोबाइल ब्राउज़र में नेटिव शेयर मेनू खुलेगा)
        if (navigator.share) {
            navigator.share({
                title: 'Teen Patti गेम',
                text: 'मेरे साथ Teen Patti खेलें और सिक्के जीतें!',
                url: window.location.href // अपने गेम का लिंक डालें
            }).then(() => {
                // सफलतापूर्वक शेयर होने पर इनाम
                giveShareReward();
            }).catch((error) => {
                // अगर यूजर शेयर कैंसिल कर देता है या एरर आता है
                console.log('शेयर रद्द किया गया या विफल रहा', error);
                // नोट: असली ऐप में आप यहाँ भी इनाम दे सकते हैं, पर ब्राउज़र में कैंसिल होने पर न दें
            });
        } else {
            // अगर ब्राउज़र Web Share API सपोर्ट नहीं करता (जैसे कंप्यूटर पर)
            // तो हम लिंक कॉपी कर सकते हैं और इनाम दे सकते हैं
            navigator.clipboard.writeText(window.location.href).then(() => {
                messageEl.textContent = "लिंक कॉपी हो गया! अब इसे दोस्तों को भेजें।";
                giveShareReward();
            }).catch(() => {
                messageEl.textContent = "शेयर करने में समस्या हुई।";
            });
        }
    }

    // इनाम देने का सहायक फंक्शन
    function giveShareReward() {
        coins += 5;
        updateCoinDisplay();
        messageEl.textContent = "🎉 शेयर करने के लिए धन्यवाद! आपको +5 सिक्के मिले।";
    }

    function showRewardedAd() {
        messageEl.textContent = "विज्ञापन लोड हो रहा है...";
        adBtn.disabled = true;
        adBox.style.display = 'block';

        adBreak({
            type: 'reward',
            name: 'coin_reward',
            beforeAd: () => {
                messageEl.textContent = "विज्ञापन चल रहा है...";
            },
            afterAd: () => {
                messageEl.textContent = "विज्ञापन समाप्त, इनाम दे रहे हैं...";
            },
            beforeReward: (showAdFn) => {
                showAdFn();
            },
            adViewed: () => {
                coins += 500;
                updateCoinDisplay();
                messageEl.textContent = "🎉 बधाई हो! 500 सिक्के मिले!";
                adBtn.disabled = false;
            },
            adDismissed: () => {
                messageEl.textContent = "विज्ञापन पूरा नहीं देखा, इनाम नहीं मिला।";
                adBtn.disabled = false;
            },
            adError: (error) => {
                console.error('Ad error:', error);
                messageEl.textContent = "विज्ञापन लोड नहीं हो सका (टेस्ट मोड)।";
                adBtn.disabled = false;
            }
        });
    }

    // पेज लोड होने पर
    window.onload = () => {
        updateCoinDisplay();
        adBox.style.display = 'block'; 
    };
</script>

</body>
</html>
