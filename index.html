<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Teen Patti Live Club - Multiplayer</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --gold: #f59e0b;
      --gold-bright: #fbbf24;
      --felt-cyan: #064e3b;
      --felt-radial: radial-gradient(ellipse at center, #065f46 0%, #064e3b 65%, #022c22 100%);
      --dark-blue: #0b1120;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: var(--dark-blue);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #gameContainer {
      width: 100vw;
      height: 100vh;
      max-width: 900px;
      max-height: 520px;
      display: flex;
      flex-direction: column;
      position: relative;
      background: radial-gradient(circle at center, #1e293b, #0f172a);
      border: 3px solid #334155;
    }

    /* TOP HEADER */
    .header {
      height: 44px;
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 2px solid var(--gold);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 12px;
      z-index: 10;
    }
    .brand {
      font-size: 14px;
      font-weight: 900;
      color: var(--gold-bright);
      text-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
    }
    .top-stats {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .coin-badge {
      background: #1e293b;
      border: 1px solid var(--gold);
      border-radius: 14px;
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 800;
      color: var(--gold-bright);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* FELT CASINO TABLE */
    .table-felt {
      flex: 1;
      margin: 10px;
      border-radius: 120px;
      background: var(--felt-radial);
      border: 8px solid #b45309;
      box-shadow: inset 0 0 50px #000, 0 0 20px rgba(0,0,0,0.8);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
    }

    /* DEALER TOP */
    .dealer-croupier {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      z-index: 5;
    }
    .dealer-pic {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.5);
    }
    .dealer-tip-bubble {
      font-size: 9px;
      font-weight: 800;
      background: rgba(0,0,0,0.85);
      border: 1px solid #38bdf8;
      color: #38bdf8;
      padding: 2px 8px;
      border-radius: 10px;
      margin-top: 2px;
    }

    /* CENTER POT */
    .pot-center {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.8);
      border: 2px solid var(--gold);
      border-radius: 20px;
      padding: 4px 18px;
      text-align: center;
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
      z-index: 4;
    }
    .pot-val {
      font-size: 18px;
      font-weight: 900;
      color: var(--gold-bright);
    }

    /* PLAYERS AROUND TABLE */
    .seats-grid {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .player-seat {
      position: absolute;
      width: 70px;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: auto;
      transition: all 0.2s;
    }
    /* 6 Seats Geometry */
    .seat-0 { bottom: 12px; left: 50%; transform: translateX(-50%); } /* YOU */
    .seat-1 { bottom: 60px; left: 30px; }
    .seat-2 { top: 60px; left: 30px; }
    .seat-3 { top: 12px; right: 120px; }
    .seat-4 { top: 60px; right: 30px; }
    .seat-5 { bottom: 60px; right: 30px; }

    .avatar-wrapper {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      background: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      position: relative;
      overflow: hidden;
    }
    .player-seat.active .avatar-wrapper {
      border-color: #22c55e;
      box-shadow: 0 0 15px #22c55e;
      animation: pulseTurn 1s infinite alternate;
    }
    .player-seat.folded { opacity: 0.35; filter: grayscale(1); }
    @keyframes pulseTurn {
      from { transform: scale(1); }
      to { transform: scale(1.1); }
    }
    .p-tag {
      font-size: 8.5px;
      font-weight: 800;
      background: #000;
      padding: 1px 4px;
      border-radius: 4px;
      margin-top: 1px;
    }
    .p-tag.seen { color: #38bdf8; border: 1px solid #0284c7; }

    /* USER CARDS DISPLAY */
    .cards-box {
      display: flex;
      gap: 4px;
      margin-top: 2px;
      z-index: 6;
    }
    .card-item {
      width: 48px;
      height: 70px;
      background: #fff;
      border: 1.5px solid var(--gold);
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2px;
      font-weight: 900;
      font-size: 11px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.7);
    }
    .card-item.red { color: #dc2626; }
    .card-item.black { color: #111; }
    .card-item.back {
      background: repeating-linear-gradient(45deg, #7f1d1d, #7f1d1d 4px, #450a0a 4px, #450a0a 8px);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold-bright);
      font-size: 20px;
    }

    /* CONTROLS BOTTOM */
    .controls-panel {
      height: 64px;
      background: rgba(15, 23, 42, 0.95);
      border-top: 2px solid var(--gold);
      display: grid;
      grid-template-columns: 1fr 1fr 1.3fr 1.1fr 1fr;
      gap: 6px;
      padding: 8px 12px;
      z-index: 10;
    }
    .action-btn {
      border: none;
      border-radius: 8px;
      font-weight: 900;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 6px rgba(0,0,0,0.5);
    }
    .action-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      filter: grayscale(80%);
    }
    .btn-pack { background: linear-gradient(180deg, #ef4444, #991b1b); color: #fff; }
    .btn-see { background: linear-gradient(180deg, #3b82f6, #1d4ed8); color: #fff; }
    .btn-chaal { background: linear-gradient(180deg, var(--gold-bright), #b45309); color: #000; }
    .btn-side { background: linear-gradient(180deg, #a855f7, #6b21a8); color: #fff; }
    .btn-show { background: linear-gradient(180deg, #22c55e, #15803d); color: #fff; }

    /* MODALS */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-card {
      background: #1e293b;
      border: 2px solid var(--gold);
      border-radius: 12px;
      padding: 18px;
      width: 100%;
      max-width: 320px;
      text-align: center;
    }
    .m-btn {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border-radius: 6px;
      border: none;
      font-weight: 800;
      cursor: pointer;
    }
    .m-btn.gold { background: var(--gold-bright); color: #000; }
    .m-btn.blue { background: #0284c7; color: #fff; }
    .m-btn.close { background: #475569; color: #fff; }
  </style>
</head>
<body>

<div id="gameContainer">
  <!-- Top Bar -->
  <div class="header">
    <div class="brand">♠ TEEN PATTI LIVE CLUB</div>
    <div class="top-stats">
      <div class="coin-badge" id="myCoinBadge">🪙 10,000</div>
      <button class="coin-badge" style="cursor:pointer;" onclick="openModal('rewardsModal')">🎁 FREE</button>
      <button class="coin-badge" style="cursor:pointer;" onclick="openModal('roomModal')">🚪 ROOM</button>
    </div>
  </div>

  <!-- Table Felt Area -->
  <div class="table-felt">
    <!-- Dealer -->
    <div class="dealer-croupier">
      <div class="dealer-pic">👩‍💼</div>
      <div class="dealer-tip-bubble" id="dealerSpeech">Welcome to the Club!</div>
    </div>

    <!-- Center Pot -->
    <div class="pot-center">
      <div style="font-size:9px; color:#94a3b8; font-weight:800;">TOTAL POT</div>
      <div class="pot-val" id="potText">🪙 0</div>
    </div>

    <!-- Dynamic Seats Grid -->
    <div class="seats-grid" id="seatsContainer"></div>

    <!-- User Playing Cards Center-Bottom -->
    <div style="display:flex; flex-direction:column; align-items:center; z-index:7;">
      <div class="cards-box" id="userCardsBox"></div>
      <div style="font-size:9px; background:rgba(0,0,0,0.85); color:var(--gold-bright); padding:2px 8px; border-radius:6px; margin-top:2px; font-weight:800;" id="userHandDesc">Tap SEE to check cards</div>
    </div>
  </div>

  <!-- Bottom Interactive Action Buttons -->
  <div class="controls-panel">
    <button class="action-btn btn-pack" id="btnPack" onclick="actionPack()">PACK</button>
    <button class="action-btn btn-see" id="btnSee" onclick="actionSee()">SEE</button>
    <button class="action-btn btn-chaal" id="btnChaal" onclick="actionBet()">
      <span id="chaalTitle">CHAAL</span>
      <span id="chaalAmt" style="font-size:9px;">(100)</span>
    </button>
    <button class="action-btn btn-side" id="btnSide" onclick="actionSideShow()">SIDE SHOW</button>
    <button class="action-btn btn-show" id="btnShow" onclick="actionShowDown()">SHOW</button>
  </div>

  <!-- REWARDS MODAL -->
  <div class="modal-overlay" id="rewardsModal">
    <div class="modal-card">
      <h3 style="color:var(--gold-bright); margin-bottom:10px;">🎁 FREE REWARDS HUB</h3>
      <button class="m-btn gold" onclick="claimDailyReward()">📅 Daily Bonus (+2,500)</button>
      <button class="m-btn blue" onclick="applyReferral()">🤝 Apply Referral Code (+5,000)</button>
      <button class="m-btn close" onclick="closeModals()">Back</button>
    </div>
  </div>

  <!-- ROOM MODAL -->
  <div class="modal-overlay" id="roomModal">
    <div class="modal-card">
      <h3 style="color:var(--gold-bright); margin-bottom:10px;">🚪 PRIVATE CLUB ROOM</h3>
      <button class="m-btn gold" onclick="createPrivateRoom()">Create Private Table</button>
      <input type="text" id="joinRoomInput" placeholder="Enter Room ID" style="width:100%; padding:8px; margin-top:8px; border-radius:4px; border:1px solid #475569; background:#0f172a; color:#fff;">
      <button class="m-btn blue" onclick="joinPrivateRoom()">Join Room</button>
      <button class="m-btn close" onclick="closeModals()">Close</button>
    </div>
  </div>
</div>

<script>
/* ================= REAL WEB-AUDIO SYNTHESIZER ================= */
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playSound(type) {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    const now = ctx.currentTime;

    if (type === 'chip') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, now);
      osc.frequency.exponentialRampToValueAtTime(1400, now + 0.05);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
      osc.start(now); osc.stop(now + 0.05);
    } else if (type === 'deal') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(240, now);
      osc.frequency.linearRampToValueAtTime(120, now + 0.08);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
      osc.start(now); osc.stop(now + 0.08);
    } else if (type === 'win') {
      [523, 659, 783, 1046].forEach((f, i) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.setValueAtTime(f, now + i * 0.1);
        g.gain.setValueAtTime(0.2, now + i * 0.1);
        g.gain.linearRampToValueAtTime(0.01, now + i * 0.1 + 0.25);
        o.start(now + i * 0.1); o.stop(now + i * 0.1 + 0.25);
      });
    }
  } catch(e){}
}

/* ================= CLIENT LOGIC & SOCKETS ================= */
const socket = io();
let currentUser = null;
let currentTable = null;
let myCards = [];
let isSeen = false;
let myTurn = false;

// Auto Guest Authentication
fetch('/api/auth/guest', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({}) })
  .then(res => res.json())
  .then(data => {
    currentUser = data.user;
    document.getElementById('myCoinBadge').textContent = `🪙 ${currentUser.coins.toLocaleString()}`;
    socket.emit('joinQuickPlay', currentUser);
  });

/* Socket Listeners */
socket.on('tableUpdate', (data) => {
  currentTable = data;
  document.getElementById('potText').textContent = `🪙 ${data.pot.toLocaleString()}`;
  document.getElementById('dealerSpeech').textContent = data.message;
  renderSeats(data.players, data.currentTurnIdx);
  updateControls();
});

socket.on('turnStart', (turnData) => {
  myTurn = (turnData.playerId === currentUser.id);
  if (myTurn) playSound('chip');
  updateControls();
});

socket.on('privateCards', (data) => {
  myCards = data.cards;
  isSeen = false;
  playSound('deal');
  renderCards();
});

socket.on('handEnded', (data) => {
  playSound('win');
  alert(`🏆 ${data.winner} WON THE POT OF 🪙${data.pot.toLocaleString()}!\n\nAll hands revealed.`);
});

socket.on('sideShowResult', (res) => {
  alert(`⚔️ Side Show: ${res.requester} VS ${res.target}!\nLoser: ${res.loser} packed.`);
});

/* Render Functions */
function renderSeats(players, curTurnIdx) {
  const container = document.getElementById('seatsContainer');
  container.innerHTML = '';

  players.forEach((p, idx) => {
    const isMe = p.id === currentUser.id;
    const seatEl = document.createElement('div');
    seatEl.className = `player-seat seat-${p.seat} ${p.folded ? 'folded' : ''} ${curTurnIdx === idx && !p.folded ? 'active' : ''}`;
    
    seatEl.innerHTML = `
      <div class="avatar-wrapper">${isMe ? '👤' : '🧑‍🦱'}</div>
      <div style="font-size:9px; font-weight:800; max-width:65px; overflow:hidden; text-overflow:ellipsis;">${p.name}</div>
      <div style="font-size:9px; color:var(--gold-bright); font-weight:800;">🪙 ${p.coins.toLocaleString()}</div>
      <div class="p-tag ${p.isSeen ? 'seen' : ''}">${p.folded ? 'PACK' : (p.isSeen ? 'SEEN' : 'BLIND')}</div>
    `;
    container.appendChild(seatEl);
  });
}

function renderCards() {
  const box = document.getElementById('userCardsBox');
  box.innerHTML = '';
  myCards.forEach(card => {
    const el = document.createElement('div');
    if (!isSeen) {
      el.className = 'card-item back';
      el.textContent = '🂠';
    } else {
      const isRed = card.suit === '♥' || card.suit === '♦';
      el.className = `card-item ${isRed ? 'red' : 'black'}`;
      el.innerHTML = `<div>${card.rank}${card.suit}</div><div style="align-self:center; font-size:18px;">${card.suit}</div><div style="transform:rotate(180deg);">${card.rank}${card.suit}</div>`;
    }
    box.appendChild(el);
  });
}

function updateControls() {
  const btnPack = document.getElementById('btnPack');
  const btnSee = document.getElementById('btnSee');
  const btnChaal = document.getElementById('btnChaal');
  const btnSide = document.getElementById('btnSide');
  const btnShow = document.getElementById('btnShow');

  btnSee.disabled = isSeen;
  document.getElementById('chaalTitle').textContent = isSeen ? 'CHAAL' : 'BLIND';

  if (myTurn) {
    btnPack.disabled = false;
    btnChaal.disabled = false;
    btnSide.disabled = !isSeen;
    btnShow.disabled = false;
  } else {
    btnPack.disabled = true;
    btnChaal.disabled = true;
    btnSide.disabled = true;
    btnShow.disabled = true;
  }
}

/* User Actions */
function actionSee() {
  isSeen = true;
  socket.emit('actSee');
  renderCards();
  document.getElementById('userHandDesc').textContent = 'Hand: SEEN Cards';
  updateControls();
}
function actionBet() { socket.emit('actBet'); myTurn = false; updateControls(); }
function actionPack() { socket.emit('actFold'); myTurn = false; updateControls(); }
function actionSideShow() { socket.emit('actSideShow'); myTurn = false; updateControls(); }
function actionShowDown() { socket.emit('actShowDown'); myTurn = false; updateControls(); }

/* Modals & Bonus */
function openModal(id) { document.getElementById(id).style.display = 'flex'; }
function closeModals() { document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none'); }

function claimDailyReward() {
  fetch('/api/rewards/daily', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ userId: currentUser.id }) })
    .then(r => r.json())
    .then(res => {
      alert(res.message);
      currentUser.coins += res.reward;
      document.getElementById('myCoinBadge').textContent = `🪙 ${currentUser.coins.toLocaleString()}`;
      closeModals();
    });
}

function createPrivateRoom() {
  socket.emit('createPrivateRoom', currentUser);
  closeModals();
}

function joinPrivateRoom() {
  const rId = document.getElementById('joinRoomInput').value.trim();
  if (rId) {
    socket.emit('joinPrivateRoom', { roomId: rId, userData: currentUser });
    closeModals();
  }
}
</script>
</body>
</html>
