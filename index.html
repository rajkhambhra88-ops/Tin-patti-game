<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Teen Patti Live Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold: #f7d050;
      --gold-dark: #b8860b;
      --gold-bright: #ffe875;
      --table-cyan: #074254;
      --table-deep: #021a24;
      --danger: #e63946;
      --card-bg: #fcfcfc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #151c2a, #080a10 80%);
      color: #fff;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* TOP HEADER BAR */
    .top-nav {
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      background: rgba(8, 12, 20, 0.9);
      border-bottom: 1px solid rgba(247, 208, 80, 0.25);
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .brand-logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #ffd700, #b8860b);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      box-shadow: 0 0 10px rgba(247, 208, 80, 0.4);
    }
    .brand-text h1 {
      font-family: 'Cinzel', serif;
      font-size: 13px;
      color: var(--gold-bright);
      line-height: 1.1;
      letter-spacing: 0.5px;
    }
    .brand-text span {
      font-size: 9px;
      color: #9cb3c9;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      background: #00ff66;
      border-radius: 50%;
      box-shadow: 0 0 6px #00ff66;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .coin-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--gold);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      color: var(--gold-bright);
      box-shadow: inset 0 0 6px rgba(247, 208, 80, 0.2);
    }

    .btn-top {
      background: linear-gradient(180deg, #2b394f, #182232);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 5px 9px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn-free-coins {
      background: linear-gradient(180deg, #ff9f1c, #d35400);
      border-color: #ffd077;
      color: #fff;
      animation: pulse-free 2s infinite;
    }
    @keyframes pulse-free {
      0%, 100% { box-shadow: 0 0 0 rgba(255, 159, 28, 0); }
      50% { box-shadow: 0 0 12px rgba(255, 159, 28, 0.7); }
    }

    /* MAIN TABLE VIEWPORT */
    .table-container {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    .felt-table {
      width: 100%;
      max-width: 440px;
      height: 94%;
      max-height: 600px;
      background: radial-gradient(ellipse at center, #0f586e 0%, var(--table-cyan) 45%, var(--table-deep) 100%);
      border-radius: 220px;
      position: relative;
      box-shadow: 
        0 0 0 6px #1a1205,
        0 0 0 10px var(--gold-dark),
        0 0 0 13px #0f0a02,
        0 0 35px rgba(0, 212, 255, 0.35),
        inset 0 0 60px rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .table-watermark {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Cinzel', serif;
      font-size: 26px;
      color: rgba(255, 255, 255, 0.04);
      letter-spacing: 4px;
      pointer-events: none;
      text-align: center;
      line-height: 1.2;
    }

    /* DEALER AT TOP CENTER */
    .dealer-seat {
      position: absolute;
      top: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      z-index: 10;
    }
    .dealer-avatar-wrap {
      position: relative;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      box-shadow: 0 0 15px rgba(247, 208, 80, 0.4);
      background: #0f1826;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .dealer-avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .dealer-badge {
      background: linear-gradient(90deg, var(--gold-dark), var(--gold-bright), var(--gold-dark));
      color: #000;
      font-size: 8px;
      font-weight: 800;
      padding: 1px 8px;
      border-radius: 10px;
      margin-top: -6px;
      z-index: 2;
      letter-spacing: 0.5px;
    }
    .dealer-bubble {
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid var(--gold);
      color: #fff;
      font-size: 9px;
      padding: 2px 8px;
      border-radius: 10px;
      margin-top: 2px;
      white-space: nowrap;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    /* CENTER POT AREA */
    .pot-box {
      position: absolute;
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 15, 25, 0.75);
      border: 1.5px solid rgba(247, 208, 80, 0.6);
      border-radius: 20px;
      padding: 6px 16px;
      text-align: center;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6), 0 0 15px rgba(247, 208, 80, 0.25);
      z-index: 5;
    }
    .pot-label {
      font-size: 9px;
      color: #9cb3c9;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .pot-amount {
      font-size: 17px;
      font-weight: 800;
      color: var(--gold-bright);
      text-shadow: 0 0 8px rgba(247, 208, 80, 0.6);
    }
    .pot-sub {
      font-size: 8px;
      color: #79a1be;
    }

    /* BOT PLAYERS SEATS */
    .player-seat {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .player-seat.seat-top-left { top: 12%; left: 10%; }
    .player-seat.seat-top-right { top: 12%; right: 10%; }
    .player-seat.seat-mid-left { top: 40%; left: 4%; }
    .player-seat.seat-mid-right { top: 40%; right: 4%; }

    .seat-avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 2px solid #577590;
      background: #14213d;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      position: relative;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .seat-avatar.active-turn {
      border-color: #00ffcc;
      box-shadow: 0 0 18px #00ffcc;
      animation: turn-glow 1.2s infinite alternate;
    }
    @keyframes turn-glow {
      from { box-shadow: 0 0 6px #00ffcc; }
      to { box-shadow: 0 0 20px #00ffcc, 0 0 30px rgba(0,255,204,0.4); }
    }
