<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teen Patti - सिक्का संस्करण</title>
    <!-- Google Ad Placement API (विज्ञापन के लिए) -->
    <script async
            data-adbreak-test="on"
            src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX"
            crossorigin="anonymous">
    </script>
    <script>
        window.adsbygoogle = window.adsbygoogle || [];
        const adBreak = adConfig = (o) => { adsbygoogle.push(o); };
    </script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
            overflow: hidden;
        }
        .container {
            text-align: center;
            background: #16213e;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            border: 2px solid #e94560;
            width: 340px;
        }
        .title {
            font-size: 28px;
            color: #e94560;
            margin-bottom: 15px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
        }
        .coin-display {
            font-size: 22px;
            margin: 15px 0;
            background: #0f3460;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #e94560;
        }
        .coin-display span {
            color: #f1c40f;
            font-weight: bold;
        }
        .btn {
            background: #e94560;
            color: white;
            border: none;
            padding: 12px 24px;
            margin: 8px 0;
            border-radius: 50px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            font-weight: bold;
        }
        .btn:hover {
            background: #c0392b;
            transform: scale(1.02);
        }
        .btn:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
        }

        /* 🌟 विज्ञापन/वीडियो बॉक्स का डिज़ाइन 🌟 */
        .ad-container {
            margin: 15px 0;
            position: relative;
            width: 100%;
            padding: 3px;
            border-radius: 15px;
            background: linear-gradient(45deg, #f1c40f, #e94560, #0f3460, #f1c40f);
            background-size: 300% 300%;
            animation: gradientBorder 3s ease infinite;
            box-shadow: 0 0 15px rgba(233, 69, 96, 0.5);
        }

        @keyframes gradientBorder {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .ad-box-inner {
            background: #0b132b;
            border-radius: 12px;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            padding-bottom: 56.25%; /* 16:9 वीडियो रेश्यो */
            height: 0;
        }

        .ad-box-inner iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .ad-badge {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(233, 69, 96, 0.9);
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            z-index: 3;
            letter-spacing: 1px;
            pointer-events: none;
        }

        .msg {
            margin-top: 10px;
            font-size: 13px;
            color: #aaa;
            min-height: 20px;
        }

        .btn-ad {
            background: #27ae60;
            margin-top: 10px;
        }
        .btn-ad:hover {
            background: #2ecc71;
        }
        
        /* 🌟 नया रिफिल बटन 🌟 */
        .btn-refill {
            background: #f39c12;
            display: none; /* शुरुआत में छिपा हुआ */
            animation: pulse 1.5s infinite;
        }
        .btn-refill:hover {
            background: #e67e22;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .btn-share {
            background: #3498db;
            margin-top: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .btn-share:hover {
            background: #2980b9;
        }
        .btn-share svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="title">Teen Patti</div>
    
    <div class="coin-display">
        आपके सिक्के: <span id="coinDisplay">10000</span>
    </div>

    <!-- खेल बटन -->
    <button class="btn" onclick="playGame()" id="playBtn">
        खेल शुरू करें (100 सिक्के लागत)
    </button>

    <!-- 🌟 रिफिल बटन (सिर्फ तब दिखेगा जब सिक्के 100 से कम होंगे) 🌟 -->
    <button class="btn btn-refill" onclick="showRefillOptions()" id="refillBtn">
        🎁 10,000 सिक्कों का रिफिल लें
    </button>

    <!-- =========================================
         🌟 वीडियो बॉक्स (यहाँ अपना वीडियो डालें) 🌟
         ========================================= -->
    <div class="ad-container" id="adBox">
        <div class="ad-badge">GAME PROMO</div>
        <div class="ad-box-inner">
            <!-- 👇 यहाँ अपने YouTube वीडियो का ID डालें 👇 -->
            <!-- अभी के लिए मैंने एक डेमो वीडियो लगाया है, आप इसे अपने गेम के वीडियो से बदल सकते हैं -->
            <iframe 
                src="https://www.youtube.com/embed/dQw4w9WgXcQ?rel=0&showinfo=0&autoplay=0" 
                title="Game Promo Video" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
            </iframe>
        </div>
    </div>

    <!-- विज्ञापन देखकर सिक्के प्राप्त करने का बटन -->
    <button class="btn btn-ad" onclick="watchAdForCoins()" id="adBtn">
        📺 विज्ञापन देखें +500 सिक्के
    </button>

    <!-- शेयर बटन (+2000 सिक्के) -->
    <button class="btn btn-share" onclick="shareGame()" id="shareBtn">
        <svg viewBox="0 0 24 24">
            <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/>
        </svg>
        गेम शेयर करें (+2000 सिक्के)
    </button>

    <div class="msg" id="message"></div>
</div>

<script>
    // ==========================================
    // 🌟 सिक्कों का लॉजिक (स्मार्ट तरीका) 🌟
    // ==========================================
    // शुरुआत में 10,000 सिक्के दें (सिर्फ पहली बार जब गेम ओपन हो)
    let coins = parseInt(localStorage.getItem('teenPattiCoins'));
    if (isNaN(coins)) {
        coins = 10000; 
    }

    const coinDisplay = document.getElementById('coinDisplay');
    const messageEl = document.getElementById('message');
    const refillBtn = document.getElementById('refillBtn');
    const playBtn = document.getElementById('playBtn');

    // स्क्रीन अपडेट करने का फंक्शन
    function updateCoinDisplay() {
        coinDisplay.textContent = coins;
        localStorage.setItem('teenPattiCoins', coins);

        // अगर सिक्के 100 से कम हो जाएं, तो रिफिल बटन दिखाएं और खेलने का बटन छिपा दें
        if (coins < 100) {
            refillBtn.style.display = 'block';
            playBtn.style.display = 'none';
        } else {
            refillBtn.style.display = 'none';
            playBtn.style.display = 'block';
        }
    }

    // खेल खेलने का बटन
    function playGame() {
        if (coins < 100) {
            messageEl.textContent = "सिक्के कम हैं, कृपया रिफिल करें!";
            updateCoinDisplay();
            return;
        }
        coins -= 100;
        updateCoinDisplay();
        messageEl.textContent = "खेल शुरू... (यहाँ आपका गेम लॉजिक चलेगा)";
    }

    // 🌟 रिफिल का विकल्प दिखाना 🌟
    function showRefillOptions() {
        messageEl.innerHTML = "10,000 सिक्के पाने के लिए कोई एक विकल्प चुनें:<br>1. नीचे 'विज्ञापन देखें' पर क्लिक करें।<br>2. या 'गेम शेयर करें' पर क्लिक करें।";
    }

    // ==========================================
    // 🌟 विज्ञापन देखकर 10,000 सिक्के (रिफिल) या 500 सिक्के 🌟
    // ==========================================
    function watchAdForCoins() {
        // अगर सिक्के 100 से कम हैं (यानी रिफिल की जरूरत है), तो 10,000 दें, वरना 500
        let rewardAmount = (coins < 100) ? 10000 : 500;
        
        messageEl.textContent = "विज्ञापन लोड हो रहा है...";
        
        // असली विज्ञापन का लॉजिक (टेस्ट मोड)
        adBreak({
            type: 'reward',
            name: 'coin_reward',
            beforeAd: () => {
                messageEl.textContent = "विज्ञापन चल रहा है...";
            },
            afterAd: () => {
                messageEl.textContent = "विज्ञापन समाप्त, इनाम दे रहे हैं...";
            },
            beforeReward: (showAdFn) => {
                showAdFn();
            },
            adViewed: () => {
                coins += rewardAmount;
                updateCoinDisplay();
                messageEl.textContent = "🎉 बधाई हो! आपको +" + rewardAmount + " सिक्के मिले!";
            },
            adDismissed: () => {
                messageEl.textContent = "विज्ञापन पूरा नहीं देखा, इनाम नहीं मिला।";
            },
            adError: (error) => {
                console.error('Ad error:', error);
                // अगर विज्ञापन लोड न हो (जैसे टेस्ट में), तो डेमो के लिए तुरंत सिक्के दे दें
                messageEl.textContent = "विज्ञापन लोड नहीं हो सका (टेस्ट मोड)। डेमो के लिए सिक्के दे रहे हैं...";
                setTimeout(() => {
                    coins += rewardAmount;
                    updateCoinDisplay();
                    messageEl.textContent = "🎉 डेमो इनाम: आपको +" + rewardAmount + " सिक्के मिले!";
                }, 1500);
            }
        });
    }

    // ==========================================
    // 🌟 शेयर करने पर 2000 सिक्के 🌟
    // ==========================================
    function shareGame() {
        const gameLink = window.location.href;
        // अगर सिक्के 100 से कम हैं, तो शेयर करने पर 10,000 दें, वरना 2000
        let rewardAmount = (coins < 100) ? 10000 : 2000;

        if (navigator.share) {
            navigator.share({
                title: 'Teen Patti गेम',
                text: 'मेरे साथ Teen Patti खेलें और 10,000 मुफ्त सिक्के पाएं!',
                url: gameLink
            }).then(() => {
                giveShareReward(rewardAmount);
            }).catch((error) => {
                console.log('शेयर रद्द किया गया', error);
            });
        } else {
            // अगर मोबाइल में शेयर सपोर्ट नहीं है तो लिंक कॉपी करें
            navigator.clipboard.writeText(gameLink).then(() => {
                giveShareReward(rewardAmount);
            }).catch(() => {
                messageEl.textContent = "लिंक कॉपी करने में समस्या हुई।";
            });
        }
    }

    function giveShareReward(amount) {
        coins += amount;
        updateCoinDisplay();
        messageEl.textContent = "🎉 शेयर करने के लिए धन्यवाद! आपको +" + amount + " सिक्के मिले!";
    }

    // पेज लोड होने पर
    window.onload = () => {
        updateCoinDisplay();
    };
</script>

</body>
</html>
